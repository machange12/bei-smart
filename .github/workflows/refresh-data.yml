name: Refresh data + forecasts

on:
  schedule:
    - cron: "0 3 5 * *"   # 5th of each month, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency: refresh-data

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pipeline deps
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pandas numpy requests openpyxl prophet statsmodels scikit-learn chronos-forecasting

      - name: Fetch WFP (HDX)
        continue-on-error: true   # falls back to the committed copy
        run: |
          url=$(curl -sf "https://data.humdata.org/api/3/action/package_show?id=wfp-food-prices-for-kenya" \
            | jq -r '.result.resources[] | select(.url | endswith("wfp_food_prices_ken.csv")) | .url')
          curl -sfL "$url" -o /tmp/wfp.csv
          test -s /tmp/wfp.csv && mv /tmp/wfp.csv data/raw/wfp_food_prices_ken.csv

      - name: Fetch FEWS NET (public API)
        continue-on-error: true   # falls back to the committed copy
        run: |
          curl -sfL --max-time 900 \
            "https://fdw.fews.net/api/marketpricefacts.csv?country_code=KE&start_date=2006-01-01&end_date=$(date +%Y-12-31)" \
            -o /tmp/fews.csv
          # guard: right header and not a truncated pull (>= 95% of current rows)
          head -1 /tmp/fews.csv | grep -q period_date
          test $(wc -l < /tmp/fews.csv) -ge $(( $(wc -l < data/raw/fews_kenya_full.csv) * 95 / 100 ))
          mv /tmp/fews.csv data/raw/fews_kenya_full.csv

      - name: Fetch FAO FPMA
        continue-on-error: true   # falls back to the committed copy
        run: python scripts/ingest_fpma.py --refresh

      - name: Fetch external features
        run: python scripts/fetch_external_features.py

      - name: Scrape KAMIS (last 3 months, merged into history)
        timeout-minutes: 60       # never let the scrape eat the forecast budget
        continue-on-error: true   # falls back to the committed history
        run: python scripts/scrape_kamis.py --discover --months-back 3

      - name: Build chain
        run: python scripts/build_chained_all.py

      - name: Enrich chain
        run: python scripts/enrich_chain.py

      - name: Rebuild anomalies
        run: python scripts/rebuild_anomalies.py

      - name: Rebuild forecasts
        run: python scripts/rebuild_forecasts.py

      - name: Update README numbers
        run: python scripts/update_readme_stats.py

      - uses: actions/upload-artifact@v4
        with:
          name: model-metrics
          path: data/exports/model_metrics.csv

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data data/exports data/cleaned/bei_smart_forecasting_chained_all.csv \
                  data/external data/raw/kamis_prices.csv data/raw/wfp_food_prices_ken.csv \
                  data/raw/fews_kenya_full.csv data/raw/new_sources/fpma_kenya_long.csv README.md
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "data: monthly refresh $(date +%Y-%m-%d)"
          git pull --rebase origin main   # code may have landed during the long rebuild
          git push
